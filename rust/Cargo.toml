[package]
name = "stock-monitor"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "25", default-features = false, features = ["gles", "vulkan", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "25", default-features = false, features = ["dx12", "gles", "vulkan", "wgsl"] }

[profile.release]
lto = "thin"
strip = true
